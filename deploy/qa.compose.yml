# Isolated local QA. Always use the dedicated project name documented in the runbook.
services:
  app:
    image: ${QA_IMAGE:-magic-frame-fork:qa-cc07859}
    ports:
      - "127.0.0.1:${QA_PORT:-3188}:3000"
    environment:
      DATABASE_URL: postgresql://qa:${QA_DB_PASSWORD:?Set QA_DB_PASSWORD}@db:5432/magicframeqa?schema=public
      SESSION_SECRET: ${QA_SESSION_SECRET:?Set QA_SESSION_SECRET}
      NODE_ENV: production
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://localhost:${QA_PORT:-3188}
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      - qa_configs:/app/configs
      - qa_wallpapers:/app/wallpapers
      - qa_caddy_config:/caddy/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: ${QA_DB_PASSWORD:?Set QA_DB_PASSWORD}
      POSTGRES_DB: magicframeqa
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d magicframeqa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  qa_configs:
  qa_wallpapers:
  qa_caddy_config:
  qa_pgdata:
